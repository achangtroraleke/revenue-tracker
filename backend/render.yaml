services:

  - type: web

    name: revenue-tracker-api

    env: python

    buildCommand: 
      pip install -r requirements.txt

    startCommand:
      ./start.sh


    envVars:

      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production


      - key: SECRET_KEY
        generateValue: true


      - key: DATABASE_URL
        fromDatabase:

          name: revenue-db

          property: connectionString



databases:

  - name: revenue-db

    databaseName:
      revenue_tracker

    user:
      revenue_user